- name: "Basic Example 1"
  description: "Standard two-sum case from problem statement"
  input:
    nums: [2, 7, 11, 15]
    target: 9
  expected: [0, 1]
  type: "BASIC"
  hidden: false

- name: "Basic Example 2"
  description: "Target found at later indices"
  input:
    nums: [3, 2, 4]
    target: 6
  expected: [1, 2]
  type: "BASIC"
  hidden: false

- name: "Basic Example 3"
  description: "Duplicate values, distinct indices"
  input:
    nums: [3, 3]
    target: 6
  expected: [0, 1]
  type: "BASIC"
  hidden: false

- name: "Edge: Negative Numbers"
  description: "Array contains negative values"
  input:
    nums: [-3, 4, 3, 90]
    target: 0
  expected: [0, 2]
  type: "EDGE_CASE"
  hidden: false

- name: "Edge: Target at Ends"
  description: "Solution uses first and last elements"
  input:
    nums: [1, 2, 3, 4, 5]
    target: 6
  expected: [0, 4]
  type: "EDGE_CASE"
  hidden: false

- name: "Edge: Large Numbers"
  description: "Numbers at constraint boundaries"
  input:
    nums: [-1000000000, 1000000000]
    target: 0
  expected: [0, 1]
  type: "EDGE_CASE"
  hidden: false

- name: "Performance: Large Array"
  description: "10,000 elements - tests O(n) vs O(n²)"
  input:
    nums: "GENERATE: range(10000)"
    target: 19999
  expected: [9999, 10000]
  type: "PERFORMANCE"
  hidden: true