- name: "Basic Example 1"
  description: "Target found in array"
  input:
    nums: [1,3,5,6]
    target: 5
  expected: 2
  type: "BASIC"
  hidden: false

- name: "Basic Example 2"
  description: "Target not found, insert in middle"
  input:
    nums: [1,3,5,6]
    target: 2
  expected: 1
  type: "BASIC"
  hidden: false

- name: "Basic Example 3"
  description: "Target greater than all elements"
  input:
    nums: [1,3,5,6]
    target: 7
  expected: 4
  type: "BASIC"
  hidden: false

- name: "Basic Example 4"
  description: "Target less than all elements"
  input:
    nums: [1,3,5,6]
    target: 0
  expected: 0
  type: "BASIC"
  hidden: false

- name: "Edge: Single Element - Insert Before"
  description: "Single element array, target smaller"
  input:
    nums: [5]
    target: 2
  expected: 0
  type: "EDGE_CASE"
  hidden: false

- name: "Edge: Single Element - Insert After"
  description: "Single element array, target larger"
  input:
    nums: [5]
    target: 8
  expected: 1
  type: "EDGE_CASE"
  hidden: false

- name: "Performance: Large Array"
  description: "10,000 elements"
  input:
    nums: "GENERATE: range(10000)"
    target: 5000
  expected: 5000
  type: "PERFORMANCE"
  hidden: true