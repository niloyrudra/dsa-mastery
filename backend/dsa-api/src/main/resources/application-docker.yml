server:
  port: 8080

spring:
  application:
    name: dsa-mastery-api
   
  datasource:
    url: jdbc:postgresql://dsa-mastery-postgres:5432/dsa_mastery
    username: dsa_user
    password: ${DB_PASSWORD:dsa_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
   
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
   
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
   
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

docker:
  runner:
    typescript-image: dsa-runner-typescript:latest
    javascript-image: dsa-runner-javascript:latest
    python-image: dsa-runner-python:latest
    timeout-seconds: 30

ai:
  providers:
    ollama:
      base-url: http://dsa-mastery-ollama:11434
      models:
        fast: llama3.1:8b
        coding: codellama:13b
        reasoning: deepseek-coder:33b
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      models:
        fast: gpt-4o-mini
        coding: gpt-4o
        reasoning: o1-preview

logging:
  level:
    com.dsamastery: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    operations-sorter: method