services:
  postgres:
    image: postgres:16-alpine
    container_name: dsa-mastery-postgres
    environment:
      POSTGRES_DB: dsa_mastery
      POSTGRES_USER: dsa_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dsa_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa_user -d dsa_mastery"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: dsa-mastery-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Runner build services - build the code execution containers
  runner-typescript:
    build:
      context: ./backend/dsa-execution/docker/runner-typescript
      dockerfile: Dockerfile
    container_name: dsa-runner-typescript-build
    image: dsa-runner-typescript:latest

  runner-javascript:
    build:
      context: ./backend/dsa-execution/docker/runner-javascript
      dockerfile: Dockerfile
    container_name: dsa-runner-javascript-build
    image: dsa-runner-javascript:latest

  runner-python:
    build:
      context: ./backend/dsa-execution/docker/runner-python
      dockerfile: Dockerfile
    container_name: dsa-runner-python-build
    image: dsa-runner-python:latest

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa-mastery-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD:-dsa_password}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - gradle_cache:/home/gradle/.gradle
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsa-mastery-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  ollama_data:
  gradle_cache:

networks:
  default:
    name: dsa-mastery-network